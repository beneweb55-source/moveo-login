name: Frembed Host Watcher

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch-frembed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Probe Frembed and update host if rotated
        run: node --import tsx scripts/watch-frembed.ts

      - name: Test and push if updated
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            npm test
            git config user.name "frembed-watcher[bot]"
            git config user.email "frembed-watcher[bot]@users.noreply.github.com"
            git add lib/providers.ts next.config.ts tests/csp.test.ts tests/providers.test.ts
            git commit -m "chore(frembed): auto-update embed host"
            git push
          else
            echo "No Frembed host change detected."
          fi
